name: ci
on:
  workflow_call:
    inputs:
      node-version: { type: string, default: "22" }
      e2e:          { type: boolean, default: true }
      start-command: { type: string, default: "npm run start" }
      base-url:     { type: string, default: "http://127.0.0.1:3000" }
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ inputs.node-version }}", cache: npm }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
  e2e:
    if: ${{ inputs.e2e }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ inputs.node-version }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build --if-present
      - name: Start app
        run: (${{ inputs.start-command }} > app.log 2>&1 &) && npx -y wait-on -t 60000 ${{ inputs.base-url }}
      - run: npx playwright test
        env: { BASE_URL: "${{ inputs.base-url }}" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: "playwright-report/\ntest-results/\napp.log", retention-days: 7 }
